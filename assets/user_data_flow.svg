<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <style>
    .box { fill: #f4f7ff; stroke: #4f65e0; stroke-width: 2; rx: 14; ry: 14; }
    .arrow { stroke: #2d3f8d; stroke-width: 3; fill: none; marker-end: url(#arrowhead); }
    .text { font-family: Inter, Arial, sans-serif; fill: #1f2937; font-size: 18px; }
    .title { font-size: 28px; font-weight: 700; }
    .small { font-size: 14px; fill: #475569; }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#2d3f8d" />
    </marker>
  </defs>
  <rect x="40" y="40" width="1120" height="620" fill="#ffffff" stroke="#d1d5db" stroke-width="1" rx="24" ry="24" />
  <text x="120" y="90" class="title">agent-iq Document Chatbot Data Flow</text>
  <rect x="80" y="130" width="240" height="120" class="box" />
  <text x="100" y="170" class="text">User</text>
  <text x="100" y="195" class="small">uploads / requests</text>

  <rect x="420" y="130" width="260" height="120" class="box" />
  <text x="440" y="170" class="text">File Ingestion</text>
  <text x="440" y="195" class="small">text or PDF extraction</text>

  <rect x="420" y="280" width="260" height="120" class="box" />
  <text x="440" y="320" class="text">Chunking</text>
  <text x="440" y="345" class="small">token-aware splitting</text>
  <text x="440" y="365" class="small">(700 size / 140 overlap)</text>

  <rect x="780" y="130" width="260" height="120" class="box" />
  <text x="800" y="170" class="text">Firestore</text>
  <text x="800" y="195" class="small">store chunk metadata</text>
  <text x="800" y="215" class="small">and later vector retrieval</text>

  <rect x="780" y="280" width="260" height="120" class="box" />
  <text x="800" y="320" class="text">Gemini Embeddings</text>
  <text x="800" y="345" class="small">batch embedding generation</text>
  <text x="800" y="365" class="small">upload JSONL + download results</text>

  <rect x="420" y="460" width="620" height="120" class="box" />
  <text x="440" y="500" class="text">Chatbot Layer (future)</text>
  <text x="440" y="525" class="small">retrieve vectors, build prompt,</text>
  <text x="440" y="545" class="small">generate answers with Gemini</text>

  <path class="arrow" d="M320,190 L420,190" />
  <path class="arrow" d="M520,250 L520,280" />
  <path class="arrow" d="M520,400 L520,460" />
  <path class="arrow" d="M680,250 L780,250" />
  <path class="arrow" d="M680,400 L780,400" />
  <path class="arrow" d="M900,400 L900,460" />

  <text x="270" y="230" class="small">file path / user request</text>
  <text x="540" y="305" class="small">split into chunks for retrieval</text>
  <text x="870" y="375" class="small">write chunk docs</text>
  <text x="870" y="435" class="small">store embeddings back in Firestore</text>

  <rect x="80" y="520" width="240" height="120" class="box" />
  <text x="100" y="560" class="text">Source Files</text>
  <text x="100" y="585" class="small">text, PDF, documents</text>
  <path class="arrow" d="M200,520 L200,460" />

  <text x="640" y="600" class="small">This diagram shows the current ingestion flow and the planned retrieval/chatbot stage.</text>
</svg>